# Publishes server.json to the Official MCP Registry (io.github.yumaheymans/genmagic) whenever it
# changes on main, using GitHub Actions OIDC as the registry's own docs recommend: no stored token.
name: Publish to MCP Registry
on:
  push:
    branches: [main]
    paths: [server.json]
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Install mcp-publisher v1.8.1
        run: curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Validate server.json
        run: ./mcp-publisher validate
      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
